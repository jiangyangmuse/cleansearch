<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>离线 · CleanSearch</title>
    <meta name="theme-color" content="#24624b" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #f6f8f6; color: #202d27;
        font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      main { max-width: 30rem; padding: 2rem; text-align: center; }
      h1 { margin: 0 0 .6rem; font-size: 1.35rem; letter-spacing: -.02em; }
      p { margin: .4rem 0; color: #596960; font-size: .92rem; line-height: 1.6; }
      a {
        display: inline-block; margin-top: 1.2rem; padding: .6rem 1.1rem;
        border-radius: 10px; background: #24624b; color: #fff; text-decoration: none; font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #141a18; color: #edf4ef; }
        p { color: #adbbb2; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>现在处于离线状态</h1>
      <p>CleanSearch 的搜索与总结都在本机服务上，断网或服务未启动时只能看已缓存的壳。</p>
      <p>确认本机 CleanSearch 服务已启动，再返回搜索页。</p>
      <a href="/">返回搜索</a>
    </main>
  </body>
</html>
