<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CleanSearch</title>
    <meta name="description" content="本机干净搜索：多引擎聚合、三档分组、AI 总结与书签启动台" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="search" type="application/opensearchdescription+xml" title="CleanSearch" href="/opensearch.xml" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CleanSearch" />
    <script>
      (() => {
        let choice = "auto";
        try {
          const saved = localStorage.getItem("cs-theme");
          if (saved === "light" || saved === "dark") choice = saved;
        } catch { /* 存储不可用时跟随系统 */ }
        const dark = choice === "dark" || (choice === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.themeChoice = choice;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="color-scheme"]').content = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#1b2320" : "#ffffff";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
