name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: |
          python -m pip install -e "apps/api[dev]"
          npm ci --prefix apps/web
      - name: API tests
        run: python -m pytest apps/api -q -o "addopts="
      - name: Build web
        run: npm --prefix apps/web run build
      - name: Smoke (fixture, no upstream network)
        env:
          SEARCH_PROVIDER: fixture
          LLM_PROVIDER: stub
          CACHE_ENABLED: "true"
          BREAKER_ENABLED: "false"
          DB_PATH: ${{ runner.temp }}/cleansearch-ci/review.db
          API_TOKEN_PATH: ${{ runner.temp }}/cleansearch-ci/token.txt
          FEED_OUTPUT_PATH: ${{ runner.temp }}/cleansearch-ci/feeds.txt
          FAVICON_DIR: ${{ runner.temp }}/cleansearch-ci/icons
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/cleansearch-ci"
          python -m uvicorn app.main:app --app-dir apps/api --host 127.0.0.1 --port 18129 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python scripts/ci-wait.py http://127.0.0.1:18129
          python scripts/ci-smoke.py http://127.0.0.1:18129
