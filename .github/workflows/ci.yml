name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e "apps/api[dev]"
      - name: Test
        run: python -m pytest apps/api -q -o "addopts="
      - name: Smoke (fixture, no network)
        run: |
          SEARCH_PROVIDER=fixture LLM_PROVIDER=stub DB_PATH=/tmp/ci.db API_TOKEN_PATH=/tmp/api-token.txt             python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          python - <<'PY'
          import json, urllib.request
          req = urllib.request.Request("http://127.0.0.1:8000/api/search", data=json.dumps({"q": "python 文档"}).encode(), headers={"Content-Type": "application/json"})
          body = json.loads(urllib.request.urlopen(req).read())
          assert body["meta"]["total"] > 0, body
          print("smoke ok:", body["meta"]["total"])
          PY
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run build
