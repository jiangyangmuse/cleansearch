# 可选形态：有 Docker 时用它起 SearXNG + API。
# 无 Docker 时 M0 照样可验收：SEARCH_PROVIDER=fixture 走固定样本。
services:
  searxng:
    image: searxng/searxng:latest
    container_name: cs-searxng
    ports: ["127.0.0.1:8888:8080"]   # 只绑回环：limiter 关闭，不能对外暴露
    volumes: ["./searxng:/etc/searxng"]
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - SEARXNG_SECRET=CHANGE_ME
    restart: unless-stopped
    networks: [cs]

  api:
    build: ./apps/api
    container_name: cs-api
    env_file: .env
    environment:
      - SEARXNG_URL=http://searxng:8080
      - WEB_DIST=/web
      - DB_PATH=/data/cs.db
      - API_TOKEN_PATH=/data/api-token.txt
      - LLM_BASE_URL=${COMPOSE_LLM_BASE_URL:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [searxng]
    volumes:
      - "./apps/web/dist:/web:ro"   # 先 npm --prefix apps/web run build
      - "bookmarks:/data"
    restart: unless-stopped
    networks: [cs]

networks:
  cs:

volumes:
  bookmarks:
